name: Coverity Scan

on:
  schedule:
    - cron: '0 0 * * 1' # Mondays at 00:00 UTC
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  coverity:
    name: Coverity Scan
    if: github.repository == 'wolfSSL/wolfTrust'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: ghcr.io/wolfssl/wolfboot-ci-m33mu:v1.15
    steps:
      - uses: actions/checkout@v4
      - name: Initialize dependencies
        timeout-minutes: 10
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global url."https://github.com/".insteadOf git@github.com:
          git submodule update --init --recursive --depth 1 --jobs 4
      - name: Check build toolchains
        run: |
          cc --version
          arm-none-eabi-gcc --version
      - name: Check Coverity configuration
        env:
          COVERITY_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
          COVERITY_EMAIL: ${{ secrets.COVERITY_SCAN_EMAIL }}
        run: |
          if [ -z "$COVERITY_TOKEN" ] || [ -z "$COVERITY_EMAIL" ]; then
            echo 'Register wolfTrust on Coverity Scan and configure COVERITY_SCAN_TOKEN and COVERITY_SCAN_EMAIL.' >&2
            exit 1
          fi
      - name: Capture Coverity build
        uses: vapier/coverity-scan-action@1b6fd4eaba6651aa354c9ea7f48caa1710b4e12e # v1
        with:
          project: wolfTrust
          token: ${{ secrets.COVERITY_SCAN_TOKEN }}
          email: ${{ secrets.COVERITY_SCAN_EMAIL }}
          command: sh tools/ci-static-analysis-build.sh
          dry_run: 'true'
      - name: Restrict capture to wolfTrust sources
        shell: bash
        run: |
          export PATH="$PWD/cov-analysis/bin:$PATH"
          cov-manage-emit --dir cov-int --tu-pattern "file('/lib/')" delete
          units_file="$RUNNER_TEMP/coverity-units.txt"
          cov-manage-emit --dir cov-int list > "$units_file"
          cat "$units_file"
          if grep -Eq '^[[:space:]]*[0-9]+[[:space:]]+->[[:space:]]+.*/lib/' "$units_file" ||
              ! grep -Eq '^[[:space:]]*[0-9]+[[:space:]]+->[[:space:]]+/' "$units_file"; then
            echo '::error::Coverity capture is empty or still contains dependency sources.'
            exit 1
          fi
          tar -czf cov-int.tgz cov-int
      - name: Submit build to Coverity Scan
        shell: bash
        env:
          COVERITY_TOKEN: ${{ secrets.COVERITY_SCAN_TOKEN }}
          COVERITY_EMAIL: ${{ secrets.COVERITY_SCAN_EMAIL }}
        run: |
          response_file="$RUNNER_TEMP/coverity-upload-response.txt"
          http_status=$(curl \
            --silent --show-error \
            --output "$response_file" \
            --write-out '%{http_code}' \
            --form-string "token=$COVERITY_TOKEN" \
            --form-string "email=$COVERITY_EMAIL" \
            --form 'file=@cov-int.tgz' \
            --form-string "version=$GITHUB_SHA" \
            --form-string "description=wolfTrust $GITHUB_REF" \
            'https://scan.coverity.com/builds?project=wolfTrust')
          cat "$response_file"
          # Coverity's official upload script requires 201 for a new submission.
          if [ "$http_status" != '201' ]; then
            echo "::error::Coverity did not accept the build submission (HTTP $http_status)."
            exit 1
          fi
          printf '%s\n' 'Coverity accepted the build for analysis. Results are published after server-side processing.' >> "$GITHUB_STEP_SUMMARY"
